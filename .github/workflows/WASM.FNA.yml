name: WASM Build (FNA)

env:
  SDL_VERSION: release-3.4.4
  SDL2COMPAT_VERSION: release-2.32.66
  FNA3D_VERSION: 26.04
  FAUDIO_VERSION: 26.04
  OPENAL_VERSION: 1.24.3
  OPENSSL_VERSION: openssl-3.4
  DOTNET_RUNTIME_VERSION: wasm-10.0.3
  DOTNET_RUNTIME_JIT_VERSION: wasm-jit-11.0.0
  # .NET 11 links with its own emscripten 6.0.3 build (6ea9c28c38cd); upstream 6.0.3 is the nearest emsdk release for
  # the native jobs. The runtime and the freeze use the one .NET provisions.
  EMSDK_VERSION: 6.0.3
  ZLIB_VERSION: v1.3.1
  LIBJPEG_TURBO_VERSION: 3.0.3
  LIBPNG_VERSION: v1.6.43
  FREETYPE_VERSION: VER-2-13-3
  FONTCONFIG_VERSION: "2.15.0"
  PIXMAN_VERSION: pixman-0.43.4
  CAIRO_VERSION: "1.18.2"
  EXPAT_VERSION: R_2_6_4
  LIBFFI_VERSION: v3.4.8
  GLIB_VERSION: "2.74.0"
  MONO_VERSION: main
  DOTNET_SDK_VERSION: '11.0.x'

on: 
  push:
    branches: 
      - main 
  workflow_dispatch:
      
jobs:
  resolve-runtime:
    runs-on: ubuntu-latest
    name: Resolve patched runtime revisions
    outputs:
      runtime_sha: ${{ steps.resolve.outputs.runtime_sha }}
      jit_sha: ${{ steps.resolve.outputs.jit_sha }}
    steps:
      - name: Resolve each branch once for all producers
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY=https://github.com/r58playz/dotnet-runtime
          for entry in "runtime_sha:$DOTNET_RUNTIME_VERSION" "jit_sha:$DOTNET_RUNTIME_JIT_VERSION"; do
            KEY=${entry%%:*}
            BRANCH=${entry#*:}
            SHA=$(git ls-remote --exit-code "$REPOSITORY" "refs/heads/$BRANCH" | cut -f1)
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
            echo "$KEY=$SHA" >> "$GITHUB_OUTPUT"
            echo "$BRANCH: $SHA" >> "$GITHUB_STEP_SUMMARY"
          done

  build:
    strategy:
      matrix:
        pthread_enabled: [true, false]
    runs-on: ubuntu-latest
    name: Build SDL3, SDL2, FNA natives, OpenSSL (pthread=${{ matrix.pthread_enabled }})
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt install -y ninja-build cmake llvm lld clang build-essential python-is-python3 curl git lldb libicu-dev liblttng-ust-dev libssl-dev libkrb5-dev pigz cpio spirv-headers
      - name: Verify
        run: emcc -v
      - name: SDL3
        shell: bash
        run: |
          git clone -b ${{ env.SDL_VERSION }} https://github.com/libsdl-org/SDL
          cd SDL
          mkdir emscripten-build
          cd emscripten-build
          PTHREAD_FLAGS=${{ matrix.pthread_enabled == true && '"-pthread"' || '""' }}
          PTHREAD_ENABLED=${{ matrix.pthread_enabled == true && 'ON' || 'OFF' }}
          CFLAGS=$PTHREAD_FLAGS emcmake cmake -S .. \
            -DSDL_WERROR=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_INSTALL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=prefix \
            -DSDL_PTHREADS=$PTHREAD_ENABLED \
            -DSDL_PTHREADS_SEM=$PTHREAD_ENABLED \
            -GNinja
          ninja
      - name: SDL2
        shell: bash
        run: | 
          mkdir SDL2
          cd SDL2
          bash ../symbolrenamer.sh ../SDL/emscripten-build/libSDL3.a ./SDL3.renamed.h
          git clone -b ${{ env.SDL_VERSION }} https://github.com/libsdl-org/SDL
          cd SDL
          git apply /home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL3-SDL2.patch
          mkdir emscripten-build
          cd emscripten-build
          PTHREAD_FLAGS=${{ matrix.pthread_enabled == true && '"-pthread"' || '""' }}
          PTHREAD_ENABLED=${{ matrix.pthread_enabled == true && 'ON' || 'OFF' }}
          emcmake cmake -S .. \
            -DSDL_WERROR=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_INSTALL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=prefix \
            -DSDL_PTHREADS=$PTHREAD_ENABLED \
            -DSDL_PTHREADS_SEM=$PTHREAD_ENABLED \
            -DCMAKE_C_FLAGS="$PTHREAD_FLAGS -include /home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL2/SDL3.renamed.h" \
            -GNinja
          ninja
          cd ../..
          git clone -b ${{ env.SDL2COMPAT_VERSION }} https://github.com/libsdl-org/sdl2-compat
          cd sdl2-compat
          git apply /home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL2.patch
          mkdir emscripten-build
          cd emscripten-build
          PTHREAD_FLAGS=${{ matrix.pthread_enabled == true && '"-pthread"' || '""' }}
          emcmake cmake -S .. \
            -DSDL3_INCLUDE_DIRS="/home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL2/SDL/include" \
            -DSDL3_STATIC_LIBRARY="/home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL2/SDL/emscripten-build/libSDL3.a" \
            -DSDL2COMPAT_STATIC=1 \
            -DSDL2COMPAT_TESTS=OFF \
            -DSDL2COMPAT_X11=OFF \
            -DCMAKE_C_FLAGS="$PTHREAD_FLAGS -DSTATIC_SDL3" \
            -GNinja
          ninja
          cd ../..
          cp SDL/emscripten-build/libSDL3.a libSDL3.a
          cp sdl2-compat/emscripten-build/libSDL2-2.0.a libSDL2.a
          emcc -r -o SDL2.o -Wl,--whole-archive libSDL2.a libSDL3.a
          ar cr SDL2.a SDL2.o
      - name: FNA3D
        shell: bash
        run: |
          git clone --recursive https://github.com/FNA-XNA/FNA3D -b ${{ env.FNA3D_VERSION }}
          cd FNA3D
          git apply /home/runner/work/FNA-WASM-Build/FNA-WASM-Build/FNA3D.patch
          mkdir build
          cd build
          emcmake cmake .. \
            -DBUILD_SDL3=ON \
            -DSDL3_INCLUDE_DIRS=/home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL/include \
            -DSDL3_LIBRARIES=/home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL/emscripten-build/libSDL3.a \
            -DBUILD_SHARED_LIBS=OFF \
            -GNinja
          ninja
      - name: FAudio
        shell: bash
        run: |           
          git clone https://github.com/FNA-XNA/FAudio -b ${{ env.FAUDIO_VERSION }}
          cd FAudio
          mkdir build
          cd build
          emcmake cmake .. \
            -DBUILD_SDL3=ON \
            -DSDL3_INCLUDE_DIRS=/home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL/include \
            -DSDL3_LIBRARIES=/home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL/emscripten-build/libSDL3.a \
            -DBUILD_SHARED_LIBS=OFF \
            -GNinja
          ninja
      - name: OpenAL
        shell: bash
        run: |
          git clone https://github.com/kcat/openal-soft -b ${{ env.OPENAL_VERSION }}
          cd openal-soft
          cd build
          PTHREAD_FLAGS=${{ matrix.pthread_enabled == true && '"-pthread"' || '""' }}
          CFLAGS="-fwasm-exceptions -sWASM_LEGACY_EXCEPTIONS=0 $PTHREAD_FLAGS" CXXFLAGS="-fwasm-exceptions -sWASM_LEGACY_EXCEPTIONS=0 $PTHREAD_FLAGS -include cstdlib" emcmake cmake .. -GNinja \
            -DLIBTYPE=STATIC \
            -DALSOFT_EMBED_HRTF_DATA=ON \
            -DALSOFT_BACKEND_SDL3=ON \
            -DALSOFT_REQUIRE_SDL3=ON \
            -DSDL3_DIR=/home/runner/work/FNA-WASM-Build/FNA-WASM-Build/SDL/emscripten-build/ \
            -DALSOFT_RTKIT=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_CPUEXT_NEON=OFF
          ninja
      - name: OpenSSL
        shell: bash
        run: |
          # https://github.com/ading2210/libcurl.js/blob/b071019761fe4a9833f7f45b5f7fc2a15cb55e4a/client/tools/openssl.sh
          PREFIX=$PWD/openssl/openssl-wasm
          mkdir -p $PREFIX  
          cd openssl
          git clone -b ${{ env.OPENSSL_VERSION }} --depth=1 https://github.com/openssl/openssl
          cd openssl
          export CFLAGS="-Wall -Oz"
          export CXXFLAGS="-Wall -Oz"
          emconfigure ./Configure linux-x32 --prefix=$PREFIX -no-asm -static -no-afalgeng -no-dso -DOPENSSL_SYS_NETWARE -DSIG_DFL=0 -DSIG_IGN=0 -DHAVE_FORK=0 -DOPENSSL_NO_AFALGENG=1 -DOPENSSL_NO_SPEED=1 -DOPENSSL_NO_DYNAMIC_ENGINE -DDLOPEN_FLAG=0
          sed -i 's|^CROSS_COMPILE.*$|CROSS_COMPILE=|g' Makefile
          emmake make -j$(nproc --all) build_generated libcrypto.a
      - name: Copy Binaries (non-dotnet)
        shell: bash
        run: |
          mkdir Binaries
          PREFIX=${{ matrix.pthread_enabled == false && 'ST-' || '' }}
          cp ./SDL/emscripten-build/libSDL3.a Binaries/${PREFIX}SDL3.a
          cp ./SDL2/SDL2.a Binaries/${PREFIX}SDL2.a
          cp ./FNA3D/build/libFNA3D.a Binaries/${PREFIX}FNA3D.a
          cp ./FNA3D/build/libmojoshader.a Binaries/${PREFIX}libmojoshader.a    
          cp ./FAudio/build/libFAudio.a Binaries/${PREFIX}FAudio.a
          cp ./openal-soft/build/libopenal.a Binaries/${PREFIX}libopenal.a
          cp ./openssl/openssl/libcrypto.a Binaries/${PREFIX}libcrypto.a
      - name: Archive Libraries (pthread=${{ matrix.pthread_enabled }})
        uses: actions/upload-artifact@master
        with:
          name: WASM-libs-pthread-${{ matrix.pthread_enabled }}
          path: Binaries/

  build-dotnet:
    needs: resolve-runtime
    strategy:
      matrix:
        pthread_enabled: [true, false]
    runs-on: ubuntu-latest
    name: Build dotnet (pthread=${{ matrix.pthread_enabled }})
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt install -y ninja-build cmake llvm lld clang build-essential python-is-python3 curl git lldb libicu-dev liblttng-ust-dev libssl-dev libkrb5-dev pigz cpio spirv-headers ripgrep
      - name: Verify
        run: emcc -v
      - name: Check out pinned runtime
        uses: actions/checkout@v4
        with:
          repository: r58playz/dotnet-runtime
          ref: ${{ needs.resolve-runtime.outputs.runtime_sha }}
          path: liba/runtime
      - name: LibA
        shell: bash
        run: |
          cd liba/
          emcc liba.c -r -o liba.o \
            -DHOST_BROWSER -DHOST_WASM -DTARGET_WASM \
            -Iruntime/src/mono/ -Iruntime/src/mono/mono/ -Iruntime/src/native/public/ -Iruntime/src/mono/mono/eglib/ -Iruntime/src/native/ -I.
          emcc hot_reload_detour.c -r -o hot_reload_detour.o \
            -DHOST_BROWSER -DHOST_WASM -DTARGET_WASM \
            -Iruntime/src/mono/ -Iruntime/src/mono/mono/ -Iruntime/src/native/public/ -Iruntime/src/mono/mono/eglib/ -Iruntime/src/native/ -I.
      - name: dotnet
        shell: bash
        run: |
          THREADS_FLAG=${{ matrix.pthread_enabled == true && 'true' || 'false' }}
          ./build-dotnet.sh ./liba/runtime $THREADS_FLAG ./liba/runtime.zip
      - name: Copy Binaries (dotnet)
        shell: bash
        run: |
          mkdir -p Binaries
          PREFIX=${{ matrix.pthread_enabled == false && 'ST-' || '' }}
          cp ./liba/liba.o Binaries/${PREFIX}liba.o
          cp ./liba/hot_reload_detour.o Binaries/${PREFIX}hot_reload_detour.o
          cp ./liba/runtime.zip Binaries/${PREFIX}dotnet.zip
      - name: Archive Dotnet (pthread=${{ matrix.pthread_enabled }})
        uses: actions/upload-artifact@master
        with:
          name: WASM-dotnet-pthread-${{ matrix.pthread_enabled }}
          path: Binaries/

  build-dotnet-jit:
    needs: resolve-runtime
    runs-on: ubuntu-latest
    name: Build dotnet (pthread=true, wasm_jit=true)
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt install -y ninja-build cmake llvm lld clang build-essential python-is-python3 curl git lldb libicu-dev liblttng-ust-dev libssl-dev libkrb5-dev pigz cpio spirv-headers ripgrep
      - name: Verify
        run: emcc -v
      - name: Check out pinned runtime
        uses: actions/checkout@v4
        with:
          repository: r58playz/dotnet-runtime
          ref: ${{ needs.resolve-runtime.outputs.jit_sha }}
          path: liba/runtime
      - name: dotnet
        shell: bash
        run: |
          ./build-dotnet.sh ./liba/runtime true ./liba/runtime.zip
      - name: Copy Binaries (dotnet-jit)
        shell: bash
        run: |
          mkdir -p Binaries
          cp ./liba/runtime.zip Binaries/dotnet-jit.zip
      - name: Archive Dotnet (pthread=true, wasm_jit=true)
        uses: actions/upload-artifact@master
        with:
          name: WASM-dotnet-pthread-true-jit-true
          path: Binaries/

  freeze-emsdk:
    needs: resolve-runtime
    runs-on: ubuntu-latest
    name: Freeze emsdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt install -y build-essential python-is-python3 curl git patch libicu-dev
      - name: Check out pinned runtime
        uses: actions/checkout@v4
        with:
          repository: r58playz/dotnet-runtime
          ref: ${{ needs.resolve-runtime.outputs.jit_sha }}
          path: runtime
      - name: Provision emsdk via runtime buildsystem
        shell: bash
        run: |
          cd runtime
          ./build.sh -os browser -s provision.emsdk -c Release
      - name: Freeze emsdk
        shell: bash
        run: |
          # .NET 11 provisions into the runtime's wasm tool cache, not src/mono/browser/emsdk; the script finds it.
          ./freeze-emsdk.sh ./runtime ./emsdk-frozen.zip
      - name: Copy Binaries (emsdk)
        shell: bash
        run: |
          mkdir -p Binaries
          cp ./emsdk-frozen.zip Binaries/emsdk.zip
      - name: Archive emsdk
        uses: actions/upload-artifact@master
        with:
          name: WASM-emsdk
          path: Binaries/

  freeze-emsdk-macos:
    needs: resolve-runtime
    runs-on: macos-26
    name: Freeze emsdk (macOS ARM64)
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check out pinned runtime
        uses: actions/checkout@v4
        with:
          repository: r58playz/dotnet-runtime
          ref: ${{ needs.resolve-runtime.outputs.jit_sha }}
          path: runtime
      - name: Verify native ARM64 host
        run: test "$(uname -m)" = arm64
      - name: Provision matching .NET Emscripten SDK
        shell: bash
        run: |
          cd runtime
          ./build.sh -os browser -s provision.emsdk -c Release
      - name: Verify native SDK tools
        shell: bash
        run: |
          . runtime/eng/wasm/wasm-tool-cache.sh
          SDK="$(wasm_tool_cache_dir emscripten runtime/src/mono/browser/emscripten-version.txt "$PWD/runtime")" \
            || { echo "error: provisioned emsdk not found in the runtime's wasm tool cache" >&2; exit 1; }
          echo "emsdk: $SDK"
          # bin/clang is a wrapper script; the binary is bin/clang-<llvm major>.
          for TOOL in "$SDK"/bin/clang-[0-9]* "$SDK/bin/wasm-ld" "$SDK/bin/wasm-opt" "$SDK/node/bin/node"; do
            test "$(lipo -archs "$TOOL")" = arm64
            otool -L "$TOOL"
          done
          source "$SDK/emsdk_env.sh"
          "$SDK/emscripten/emcc" --version
          "$SDK/node/bin/node" --version
      - name: Apply patches and freeze SDK/cache
        run: ./freeze-emsdk.sh ./runtime ./emsdk-osx-arm64.zip
      - name: Test frozen SDK after relocation (ST/MT)
        shell: bash
        run: |
          unzip -q emsdk-osx-arm64.zip -d sdk-smoke
          SDK="$PWD/sdk-smoke/emsdk"
          source "$SDK/emsdk_env.sh"
          cat > sdk-smoke/smoke.c <<'C'
          #include <stdio.h>
          int main(void) { puts("emsdk smoke ok"); return 0; }
          C
          for MODE in st mt; do
            FLAGS=()
            if [[ "$MODE" == mt ]]; then
              FLAGS+=(-pthread -sPROXY_TO_PTHREAD=1 -sEXIT_RUNTIME=1)
            fi
            "$SDK/emscripten/emcc" sdk-smoke/smoke.c "${FLAGS[@]}" \
              -sENVIRONMENT=node,worker -sSINGLE_FILE=1 -o "sdk-smoke/smoke-$MODE.js"
            "$SDK/node/bin/node" "sdk-smoke/smoke-$MODE.js"
          done
      - name: Archive macOS emsdk
        uses: actions/upload-artifact@v4
        with:
          name: WASM-emsdk-osx-arm64
          path: emsdk-osx-arm64.zip
          if-no-files-found: error

  build-dotnet-cross-macos:
    needs: resolve-runtime
    runs-on: macos-26
    name: Build patched cross compilers (macOS ARM64, ST/MT/JIT MT)
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check out pinned runtime
        uses: actions/checkout@v4
        with:
          repository: r58playz/dotnet-runtime
          ref: ${{ needs.resolve-runtime.outputs.runtime_sha }}
          path: runtime-st
      - name: Check out pinned runtime
        uses: actions/checkout@v4
        with:
          repository: r58playz/dotnet-runtime
          ref: ${{ needs.resolve-runtime.outputs.runtime_sha }}
          path: runtime-mt
      - name: Check out pinned runtime
        uses: actions/checkout@v4
        with:
          repository: r58playz/dotnet-runtime
          ref: ${{ needs.resolve-runtime.outputs.jit_sha }}
          path: runtime-jit-mt
      - name: Verify build prerequisites
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          xcode-select -p
          cmake --version
          ninja --version
      - name: Validate archive assembly and dylib relocation
        run: python3 -m unittest discover -p 'test_macos_artifacts.py' -v
      - name: Build three isolated compiler configurations sequentially
        shell: bash
        run: |
          # Bootstrap once, then reuse the SDK for the other two checkouts.
          export DOTNET_INSTALL_DIR="$PWD/runtime-st/.dotnet"
          ./build-macos-cross.sh ./runtime-st false ./cross-compilers/st
          ./build-macos-cross.sh ./runtime-mt true ./cross-compilers/mt
          ./build-macos-cross.sh ./runtime-jit-mt true ./cross-compilers/jit-mt
      - name: Preserve compiler executable permissions in tar
        run: tar -czf dotnet-cross-osx-arm64.tar.gz -C cross-compilers st mt jit-mt
      - name: Archive macOS cross compilers
        uses: actions/upload-artifact@v4
        with:
          name: WASM-dotnet-cross-osx-arm64
          path: dotnet-cross-osx-arm64.tar.gz
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    needs: [build, build-dotnet, build-dotnet-jit, freeze-emsdk, freeze-emsdk-macos, build-dotnet-cross-macos]
    name: Create Release
    steps:
      - name: Check out assembly scripts
        uses: actions/checkout@v4
      - name: Generate Release Name
        run: echo RELEASE_NAME=$(uuidgen) >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Organize binaries for release
        run: |
          mkdir release_assets
          find artifacts/ -type f | while read file; do
            cp "$file" release_assets/
          done
      - name: Assemble complete macOS runtime ZIPs from Linux payloads
        shell: bash
        run: |
          python3 -m unittest discover -p 'test_macos_artifacts.py' -v
          mkdir cross-compilers
          tar -xzf artifacts/WASM-dotnet-cross-osx-arm64/dotnet-cross-osx-arm64.tar.gz -C cross-compilers
          python3 ./assemble-macos-dotnet.py artifacts cross-compilers release_assets
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: 'FNALibs WASM ${{ env.RELEASE_NAME }}'
          body: 'These are the FNA libs build for WASM (Emscripten)'
          commit: ${{ github.ref_name }}
          tag: ${{ env.RELEASE_NAME }}
          removeArtifacts: true
          artifacts: "release_assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
